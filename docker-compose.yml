services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ipmkn
      POSTGRES_USER: ipmkn
      POSTGRES_PASSWORD: ipmkn
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ipmkn -d ipmkn"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://ipmkn:ipmkn@db:5432/ipmkn
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 10
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./Baza_voprosov_itog.docx:/materials/Baza_voprosov_itog.docx:ro

  worker:
    build:
      context: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://ipmkn:ipmkn@db:5432/ipmkn
    command: python -m app.worker
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      target: development
    environment:
      VITE_API_BASE_URL: /api
      VITE_APP_NAME: ${APP_NAME:-ИПМКН Старт}
    command: pnpm dev --host 0.0.0.0
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  postgres_data:
  frontend_node_modules:
