[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[project]
name = "ipmkn-start-backend"
version = "0.1.0"
description = "Backend for the IPMKN freshman helper VK Mini App"
requires-python = ">=3.12,<3.15"
dependencies = [
  "aiosqlite==0.22.1",
  "alembic==1.18.5",
  "asyncpg==0.31.0",
  "fastapi==0.140.13",
  "httpx==0.28.1",
  "itsdangerous==2.2.0",
  "orjson==3.11.9",
  "psycopg[binary]==3.3.4",
  "pydantic-settings==2.14.2",
  "python-docx==1.2.0",
  "python-multipart==0.0.32",
  "rapidfuzz==3.14.5",
  "sqlalchemy[asyncio]==2.0.51",
  "uvicorn[standard]==0.51.0",
]

[project.optional-dependencies]
dev = [
  "mypy==1.20.2",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-cov==7.1.0",
  "ruff==0.16.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
